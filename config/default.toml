[project]
release = "FY2027"
release_year = 2027
coding_system = "ICD-10-CM"
data_dir = "data"

[security]
allowed_hosts = ["ftp.cdc.gov", "www.cdc.gov"]
request_timeout_seconds = 30
download_retries = 3
max_download_bytes = 104857600
max_archive_members = 20000
max_archive_uncompressed_bytes = 536870912
max_archive_member_bytes = 104857600
max_compression_ratio = 2000

[[sources]]
id = "table_and_index"
role = "official_tabular_and_alphabetic_index"
