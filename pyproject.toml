[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icd-kev-dataset-builder"
version = "0.1.0"
description = "A version-locked ICD-10-CM synthetic dataset pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "openai>=3.44,<4"]
license = {file = "LICENSE"}

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
test = ["pytest>=8,<9"]

[project.scripts]
icd-data = "icd_kev_dataset_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
